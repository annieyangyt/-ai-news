name: Daily Tech News Push (Deep Analysis)

on:
  schedule:
    # 每天北京时间早上 7:00 (即 UTC 前一天 23:00) 运行
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install feedparser requests
    
    # 🆕 使用 GitHub Actions Cache 保存历史数据（推荐！）
    - name: Cache history data
      uses: actions/cache@v3
      with:
        path: news_history.json
        key: news-history-${{ github.run_number }}
        restore-keys: |
          news-history-
    
    - name: Run script
      env:
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python tech_news.py
    
    # 🆕 可选：上传报告为 Artifact（可下载查看）
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-report-${{ github.run_number }}
        path: reports/
        retention-days: 30  # 保留30天
