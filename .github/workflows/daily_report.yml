name: Daily Strategy Push & Web Deploy

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions: # 关键：赋予部署网页的写入权限
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 确保能处理历史记录

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install feedparser requests markdown

    - name: Run script
      env:
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python tech_news.py

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./ # 部署当前目录下的 index.md
        publish_branch: gh-pages # 部署到此分支
